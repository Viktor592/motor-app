version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: motor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       motor_db
      POSTGRES_USER:     motor
      POSTGRES_PASSWORD: motor_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U motor -d motor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: motor_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://motor:motor_secret@postgres:5432/motor_db
      REDIS_URL:    redis://redis:6379
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      retries: 5

  saas:
    build:
      context: ./apps/saas
      dockerfile: Dockerfile
      args:
        VITE_CLIENT_WEB_URL: http://5.35.89.212:3001
        VITE_STAFF_WEB_URL:  http://5.35.89.212:3002
        VITE_ADMIN_URL:      http://5.35.89.212:3003
    container_name: motor_saas
    restart: unless-stopped

  client-web:
    build:
      context: ./apps/client-web
      dockerfile: Dockerfile
    container_name: motor_client_web
    restart: unless-stopped

  staff-web:
    build:
      context: ./apps/staff-web
      dockerfile: Dockerfile
    container_name: motor_staff_web
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: motor_admin
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: motor_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - saas
      - client-web
      - staff-web
      - admin
    ports:
      - "80:80"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
