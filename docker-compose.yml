version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: motor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       motor_db
      POSTGRES_USER:     motor
      POSTGRES_PASSWORD: motor_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor -d motor_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: motor_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:              production
      PORT:                  3000
      DATABASE_URL:          postgresql://motor:motor_secret@postgres:5432/motor_db
      REDIS_URL:             redis://redis:6379
      JWT_ACCESS_SECRET:     ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET:    ${JWT_REFRESH_SECRET:-change_me_refresh}
      JWT_ACCESS_EXPIRES:    15m
      JWT_REFRESH_EXPIRES:   30d
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY}
      ALLOWED_ORIGINS:       http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SaaS (логин + регистрация автосервиса) ──────────────
  app-saas:
    build:
      context: ./apps/saas
      dockerfile: Dockerfile
    container_name: motor_saas
    restart: unless-stopped
    ports:
      - "3004:80"

  # ── Client app ──────────────────────────────────────────
  app-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: motor_client
    restart: unless-stopped
    ports:
      - "3001:80"

  # ── Staff app (мастер/исполнитель) ──────────────────────
  app-staff:
    build:
      context: ./apps/staff
      dockerfile: Dockerfile
    container_name: motor_staff
    restart: unless-stopped
    ports:
      - "3002:80"

  # ── Admin app ───────────────────────────────────────────
  app-admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: motor_admin
    restart: unless-stopped
    ports:
      - "3003:80"

  # ── Nginx (reverse proxy) ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: motor_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - app-saas
      - app-client
      - app-staff
      - app-admin
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
