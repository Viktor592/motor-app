global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: motor-app

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  # ── Backend API метрики ──────────────────────────────────────
  - job_name: motor-backend
    static_configs:
      - targets: [backend:3000]
    metrics_path: /metrics
    scrape_interval: 15s

  # ── PostgreSQL ───────────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
    scrape_interval: 30s

  # ── Nginx ────────────────────────────────────────────────────
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
    scrape_interval: 30s

  # ── Node (сам сервер) ────────────────────────────────────────
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
    scrape_interval: 30s

  # ── Prometheus сам о себе ────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
