<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МОТОР — Нет соединения</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117; color: #f1f1f3;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .icon    { font-size: 64px; margin-bottom: 20px; }
  h1       { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
  p        { color: #8b8fa8; font-size: 0.95rem; line-height: 1.6; max-width: 320px; margin: 0 auto 28px; }
  .btn     { display: inline-block; padding: 13px 28px; background: #ff6200; color: #fff; border-radius: 12px; font-weight: 700; font-size: 0.9rem; text-decoration: none; cursor: pointer; border: none; }
  .status  { margin-top: 20px; font-size: 0.8rem; color: #8b8fa8; }
  .dot     { display: inline-block; width: 8px; height: 8px; background: #dc2626; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div>
  <div class="icon">📡</div>
  <h1>Нет соединения</h1>
  <p>Проверьте подключение к интернету и попробуйте снова. Некоторые данные могут быть доступны в кэше.</p>
  <button class="btn" onclick="window.location.reload()">🔄 Обновить</button>
  <div class="status"><span class="dot"></span>Офлайн</div>
</div>
<script>
  window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>
