# API — проксируем на backend
upstream backend { server motor_backend:3000; }

# SaaS — логин и регистрация автосервиса (главная страница)
server {
    listen 80;
    server_name localhost saas.motor-app.ru;

    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location / { proxy_pass http://motor_saas:80; proxy_set_header Host $host; }
}

# Client app — порт 3001
server {
    listen 3001;
    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; }
    location / { proxy_pass http://motor_client:80; proxy_set_header Host $host; }
}

# Staff app — порт 3002
server {
    listen 3002;
    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; }
    location / { proxy_pass http://motor_staff:80; proxy_set_header Host $host; }
}

# Admin app — порт 3003
server {
    listen 3003;
    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; }
    location / { proxy_pass http://motor_admin:80; proxy_set_header Host $host; }
}
