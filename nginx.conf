# ─── SaaS (логин + регистрация) — главная страница :80 ─────────────────────
server {
    listen 80;
    server_name _;
    client_max_body_size 6M;

    # API → backend
    location /api/ {
        proxy_pass         http://motor_backend:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # SaaS Web App
    location / {
        proxy_pass http://motor_saas:80;
        proxy_set_header Host $host;
    }
}

