name: Nightly Backup

on:
  schedule:
    - cron: '0 2 * * *'   # каждую ночь в 02:00 UTC
  workflow_dispatch:        # ручной запуск

jobs:
  backup:
    name: PostgreSQL → S3 backup
    runs-on: ubuntu-latest

    steps:
      - name: Backup database
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DATE=$(date +%Y-%m-%d_%H-%M)
            FILE="motor_backup_${DATE}.sql.gz"

            echo "==> Creating backup ${FILE}..."
            docker exec motor_postgres pg_dump -U motor motor_db | gzip > /tmp/${FILE}

            # Загрузить в S3 (Selectel / Yandex Object Storage / MinIO)
            if command -v aws &>/dev/null; then
              aws s3 cp /tmp/${FILE} s3://${{ secrets.S3_BUCKET }}/backups/${FILE} \
                --endpoint-url ${{ secrets.S3_ENDPOINT }}
              echo "==> Uploaded to S3 ✅"
            else
              echo "==> aws CLI not found, keeping local backup"
            fi

            # Удалить локальный файл
            rm /tmp/${FILE}

            # Удалить S3-бэкапы старше 30 дней
            if command -v aws &>/dev/null; then
              aws s3 ls s3://${{ secrets.S3_BUCKET }}/backups/ \
                --endpoint-url ${{ secrets.S3_ENDPOINT }} | \
                awk '{print $4}' | \
                while read f; do
                  fdate=$(echo $f | grep -oP '\d{4}-\d{2}-\d{2}')
                  if [[ $(date -d "$fdate" +%s 2>/dev/null) -lt $(date -d "30 days ago" +%s) ]]; then
                    aws s3 rm s3://${{ secrets.S3_BUCKET }}/backups/$f \
                      --endpoint-url ${{ secrets.S3_ENDPOINT }}
                    echo "Removed old backup: $f"
                  fi
                done
            fi

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to:      ${{ secrets.TELEGRAM_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "⚠️ *МОТОР* — ночной бэкап упал! Проверь GitHub Actions."
