name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck + lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       motor_test
          POSTGRES_USER:     motor
          POSTGRES_PASSWORD: motor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d motor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV:           test
      DATABASE_URL:       postgresql://motor:motor_test@localhost:5432/motor_test
      JWT_ACCESS_SECRET:  ci_access_secret_32chars_minimum_xx
      JWT_REFRESH_SECRET: ci_refresh_secret_32chars_minimum_x
      AI_PROVIDER:        mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run migrations
        run: npx prisma migrate deploy
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests
        run: npm test --if-present -- --passWithNoTests

  apps:
    name: ${{ matrix.app }} — build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client-web, staff-web, saas, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        # tsc --noEmit намеренно не запускаем: CSS-модули ломают проверку типов,
        # Vite прекрасно собирает и без отдельного тайпчека (см. историю коммитов)
        run: npm run build

  docker:
    name: Docker build check — ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [backend, apps]
    strategy:
      matrix:
        app: [backend, client-web, staff-web, saas, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        if: matrix.app == 'backend'
        run: docker build ./backend -t motor-backend:ci
      - name: Build ${{ matrix.app }} image
        if: matrix.app != 'backend'
        run: >
          docker build ./apps/${{ matrix.app }} -t motor-${{ matrix.app }}:ci
          --build-arg VITE_SAAS_URL=http://localhost
          --build-arg VITE_CLIENT_WEB_URL=http://localhost:3001
          --build-arg VITE_STAFF_WEB_URL=http://localhost:3002
          --build-arg VITE_ADMIN_URL=http://localhost:3003
