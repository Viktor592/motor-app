name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────
  backend:
    name: Backend — typecheck + lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       motor_test
          POSTGRES_USER:     motor
          POSTGRES_PASSWORD: motor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motor -d motor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV:           test
      DATABASE_URL:       postgresql://motor:motor_test@localhost:5432/motor_test
      JWT_ACCESS_SECRET:  ci_access_secret_32chars_minimum
      JWT_REFRESH_SECRET: ci_refresh_secret_32chars_minimum
      AI_PROVIDER:        mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present -- --passWithNoTests

  # ── Web ─────────────────────────────────────────────────────
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://motor-app.ru/api/v1

  # ── Docker build check ────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, web]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t motor-backend:ci

      - name: Build web image
        run: docker build ./web -t motor-web:ci
