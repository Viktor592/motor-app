name: CD — Deploy to Production

on:
  push:
    branches: [main]

# Только один деплой одновременно
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Запускать только если CI прошёл
    needs: []
    environment: production

    steps:
      - uses: actions/checkout@v4

      # ── Build & push Docker images ─────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context:   ./backend
          push:      true
          tags:      ${{ secrets.DOCKER_USER }}/motor-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v5
        with:
          context:   ./web
          push:      true
          tags:      ${{ secrets.DOCKER_USER }}/motor-web:latest
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}/api/v1
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Deploy via SSH ─────────────────────────────────────
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/motor-app

            echo "==> Pulling latest images..."
            docker compose pull backend web

            echo "==> Running migrations..."
            docker compose run --rm backend npx prisma migrate deploy

            echo "==> Restarting services..."
            docker compose up -d --no-deps backend web nginx

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Health check..."
            sleep 5
            curl -sf http://localhost/health || (echo "Health check failed!" && exit 1)

            echo "==> Deploy complete ✅"

      # ── Notify Telegram ────────────────────────────────────
      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to:      ${{ secrets.TELEGRAM_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *МОТОР задеплоен*
            Коммит: `${{ github.sha | slice(0,7) }}`
            Автор: ${{ github.actor }}
            Ветка: ${{ github.ref_name }}

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to:      ${{ secrets.TELEGRAM_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *МОТОР — деплой упал*
            Коммит: `${{ github.sha }}`
            Посмотри: ${{ github.server_url }}/${{ github.repository }}/actions
